name: YAML release catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: yaml-release-catalog
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'mareklangiewicz/AM' && github.ref == 'refs/heads/main-marek'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Collect and publish YAML facts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pub="$RUNNER_TEMP/catalog.git"
          git init --bare "$pub"
          # Fetch through checkout's authenticated configuration; keep the
          # publication repository remote-free for the existing local writer.
          git fetch origin refs/heads/release-catalog
          parent=$(git rev-parse FETCH_HEAD)
          git push "$pub" "$parent:refs/heads/catalog"
          python3 tools/catalog-collector/host_catalog.py --repo "$pub" --parent "$parent" \
            --batch-size 500 \
            --report "$RUNNER_TEMP/catalog-report.json"
          pin=$(git --git-dir="$pub" rev-parse refs/heads/catalog)
          git fetch "$pub" "$pin"
          # The candidate is a child of the exact fetched publication. A
          # concurrent publication refuses rather than overwriting its facts.
          git push --force-with-lease="refs/heads/release-catalog:$parent" origin "$pin:refs/heads/release-catalog"
