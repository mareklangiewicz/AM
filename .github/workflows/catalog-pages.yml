name: Catalog browser review
on:
  push:
    branches: [browser-review]
    paths:
      - web/catalog/**
      - tools/catalog-browser/**
      - tools/catalog-contract/**
      - tools/catalog-collector/**
      - .github/workflows/catalog-pages.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy reviewed main source (requires separate activation variable)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'mareklangiewicz/AM' && (github.ref == 'refs/heads/main-marek' || github.ref == 'refs/heads/browser-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node tools/catalog-browser/test_catalog.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Prepare saved public observations for browser review
        shell: bash
        run: |
          set -euo pipefail
          baseline=cbda9fb78ce4a6f29bdabd63d57f3c0085e8744f
          git fetch --no-tags origin "$baseline"
          python3 -B tools/catalog-browser/review_snapshot.py --repo . --baseline "$baseline" \
            --source "$GITHUB_SHA" --destination "$RUNNER_TEMP/review-data"
          python3 tools/catalog-browser/stage.py "$RUNNER_TEMP/catalog-pages" --review-data "$RUNNER_TEMP/review-data"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/catalog-pages
  deploy:
    needs: build
    if: github.ref == 'refs/heads/browser-review' || (inputs.deploy && vars.CATALOG_BROWSER_ENABLED == 'true')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed main-owned browser
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
