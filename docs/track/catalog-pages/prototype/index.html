<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AM catalog · prototype</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--panel:#fff;--ink:#182536;--muted:#637184;--line:#dbe1e8;--accent:#126b59}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui}header,main{max-width:1240px;margin:auto;padding:28px}header{border-bottom:1px solid var(--line)}h1{font-size:40px;letter-spacing:-1.5px;margin:4px 0}h2,h3{margin:8px 0}a{color:var(--accent)}button,input,select{font:inherit;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}button,a{cursor:pointer}button:hover{border-color:var(--accent)}small,.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}input{flex:1;min-width:150px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}.card{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:12px}.tile{display:inline-grid;place-items:center;background:var(--bg);width:42px;height:42px;border-radius:10px;color:var(--accent);font-weight:bold}.split{display:grid;grid-template-columns:260px 1fr;gap:30px}.list{display:grid;align-content:start;gap:5px;max-height:65vh;overflow:auto}.list a{padding:7px 10px;text-decoration:none}.selected{background:var(--panel);border-left:3px solid var(--accent)}article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}.asset{padding:9px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.badge{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 8px;display:inline-block;margin:3px}.match{color:var(--accent)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px;border-bottom:1px solid var(--line)}#status{overflow-wrap:anywhere}#diagnostics{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;padding:15px}footer{margin-bottom:100px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:15px;background:#172636;color:white;padding:10px;border-radius:40px;box-shadow:0 6px 25px #0003;white-space:nowrap;font-size:13px}.switcher button{background:transparent;color:white;border-color:#526070}#error{color:#bd3939}body.dark{--bg:#101820;--panel:#18232e;--ink:#edf3f8;--muted:#a7b4c1;--line:#344452;--accent:#75dcc1;color-scheme:dark}@media(prefers-color-scheme:dark){body:not(.light){--bg:#101820;--panel:#18232e;--ink:#edf3f8;--muted:#a7b4c1;--line:#344452;--accent:#75dcc1}}@media(max-width:700px){header,main{padding:18px}.split{grid-template-columns:1fr}.list{max-height:160px}h1{font-size:30px}td,th{padding:8px}.switcher{gap:8px}}
</style>
<header><div class="eyebrow">AM / public release catalog · throwaway prototype</div><h1>Find your next tool.</h1><p class="muted">Explore published releases and original upstream downloads.</p><div id="status" role="status">Resolving catalog snapshot…</div><div class="tools"><input id="search" aria-label="Search app names" placeholder="Search app names…"><select id="platform" aria-label="Platform"><option value="all">All platforms</option><option value="linux">Linux</option><option value="windows">Windows</option><option value="mac">macOS</option></select><select id="arch" aria-label="Architecture"><option value="all">All architectures</option><option value="x64">x86_64</option><option value="arm64">ARM64</option></select><button id="theme">Light / dark</button><button id="refresh">Latest snapshot</button></div><small>Search covers AM names only. Platform highlights are filename guesses, not AM support claims.</small></header>
<main><p id="error" role="alert"></p><div id="content"></div><footer><details><summary>Prototype state and measurements</summary><pre id="diagnostics"></pre></details></footer></main><nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variant"></span><button id="next" aria-label="Next variant">→</button></nav>
<script type="module" src="app.mjs"></script></html>
