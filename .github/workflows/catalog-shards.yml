name: Bounded sharded catalog validation
on:
  workflow_dispatch:
    inputs:
      approved_revision:
        description: Reviewed full source commit SHA
        type: string
        required: true
      inventory_sha256:
        description: Reviewed exact bounded shard inventory SHA256
        type: string
        required: true
      previous_publication:
        description: Exact release-catalog parent SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: restricted-catalog-validation
  cancel-in-progress: false
env:
  CTX_REPOSITORY: ${{ github.repository }}
  CTX_REPOSITORY_ID: ${{ github.repository_id }}
  CTX_EVENT: ${{ github.event_name }}
  CTX_REF: ${{ github.ref }}
  CTX_SHA: ${{ github.sha }}
  CTX_WORKFLOW_SHA: ${{ github.workflow_sha }}
  CTX_RUN_ID: ${{ github.run_id }}
  CTX_RUN_ATTEMPT: ${{ github.run_attempt }}
  CTX_APPROVED_REVISION: ${{ inputs.approved_revision }}
  CTX_INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
  CTX_PREVIOUS_PUBLICATION: ${{ inputs.previous_publication }}
jobs:
  plan:
    if: github.repository == 'mareklangiewicz/AM' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main-marek'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: plan
        name: Validate complete inventory without credentials
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools/catalog-collector')
          from shard_delivery import inventory
          context = {k[4:].lower(): v for k, v in os.environ.items() if k.startswith('CTX_')}
          raw = pathlib.Path('docs/track/release-catalog/research/appimage-next-large-batch-20261102/prepared/inventory.json').read_bytes()
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifests = inventory(context, raw, revision, pathlib.Path.cwd())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix='+json.dumps({'shard':sorted(manifests)}, separators=(',', ':'))+'\n')
          PY
  collect:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect one bounded shard
        env:
          COLLECTOR_WORKFLOW_TOKEN: ${{ github.token }}
          SHARD_NAME: ${{ matrix.shard }}
        run: |
          python3 -B - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools/catalog-collector')
          from shard_delivery import collect_shard
          context = {k[4:].lower(): v for k, v in os.environ.items() if k.startswith('CTX_')}
          raw = pathlib.Path('docs/track/release-catalog/research/appimage-next-large-batch-20261102/prepared/inventory.json').read_bytes()
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          token = os.environ.pop('COLLECTOR_WORKFLOW_TOKEN').encode('ascii')
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          result = collect_shard(context, raw, revision, pathlib.Path.cwd(), os.environ['SHARD_NAME'], token,
                                 temporary/'restricted-catalog', temporary/'catalog-prior')
          token = b''
          raise SystemExit(0 if result else 1)
          PY
      - name: Preserve exact shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: restricted-catalog-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/restricted-catalog/
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recompute every shard and publish one atomic root
        env:
          PUBLISHER_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools/catalog-collector')
          from shard_delivery import inventory, list_artifacts, publish
          context = {k[4:].lower(): v for k, v in os.environ.items() if k.startswith('CTX_')}
          raw = pathlib.Path('docs/track/release-catalog/research/appimage-next-large-batch-20261102/prepared/inventory.json').read_bytes()
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifests = inventory(context, raw, revision, pathlib.Path.cwd())
          token = os.environ.pop('PUBLISHER_WORKFLOW_TOKEN').encode('ascii')
          artifacts = list_artifacts(context, manifests, token)
          result = publish(context, raw, revision, pathlib.Path.cwd(), artifacts, token,
                           pathlib.Path(os.environ['RUNNER_TEMP'])/'catalog-publication')
          token = b''
          print(json.dumps(result))
          PY
      - name: Preserve root publication provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalog-shard-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-publication/publication.json
          retention-days: 7
          if-no-files-found: warn
