name: "Version catalog"

# First version: manual only (Actions tab, "Run workflow"). No schedule, no Pages.
# Commits tools/version-catalog/versions.tsv back to the branch it ran on (only if changed).
# Runs the same script you can run locally: tools/version-catalog/catalog.sh
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: "Build versions.tsv"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Run catalog.sh"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh tools/version-catalog/catalog.sh . "$RUNNER_TEMP/vc-cache" > tools/version-catalog/versions.tsv

      - name: "Summary"
        run: |
          {
            echo "### versions.tsv"
            echo
            echo "Rows: $(grep -vc '^#' tools/version-catalog/versions.tsv || true)"
            for s in ok unknown error; do
              echo "- $s: $(awk -F'\t' -v s="$s" '$7==s' tools/version-catalog/versions.tsv | wc -l)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Commit versions.tsv"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/version-catalog/versions.tsv
          if git diff --cached --quiet; then
            echo "versions.tsv unchanged, nothing to commit"
          else
            git commit -m "version-catalog: update versions.tsv"
            git push
          fi
