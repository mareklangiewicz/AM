$schema: https://json-schema.org/draft/2020-12/schema
title: AM catalog
description: >-
  Every document under main-marek's catalog/, and the collector's
  tools/catalog-collector/retired-names.yaml, names one of these kinds in its
  first key, $schema. Field order here is the canonical order. What JSON Schema
  cannot say (the byte grammar, cross-field rules) is in docs/catalog-format.md.
$defs:
  apps:
    description: catalog/apps.yaml, every app AM knows, with its repository file and recipe labels.
    type: object
    additionalProperties: false
    required: [$schema, apps]
    properties:
      $schema:
        description: Names this schema and kind.
        const: ../schemas/catalog.schema.yaml#/$defs/apps
      apps:
        description: Apps by AM name, in byte order.
        type: object
        additionalProperties: false
        patternProperties:
          ^[a-z0-9][a-z0-9_.+-]{0,63}$: {$ref: '#/$defs/app'}
  app:
    description: One app; an architecture is listed only when AM has a recipe for it.
    type: object
    additionalProperties: false
    required: [repository]
    properties:
      repository:
        description: The file, relative to catalog/, holding the releases of the repository this app installs from.
        type: string
        pattern: ^repositories/[a-z0-9][a-z0-9_.+-]{0,63}\.yaml$
      x86_64: {$ref: '#/$defs/recipe'}
      aarch64: {$ref: '#/$defs/recipe'}
      i686: {$ref: '#/$defs/recipe'}
      armv7l: {$ref: '#/$defs/recipe'}
  recipe:
    description: >-
      declaration: the recipe only names what to download and AM's reviewed
      installer does the rest. script: the recipe is its own shell script; read
      it before installing.
    type: string
    enum: [declaration, script]

  repository:
    description: catalog/repositories/<name>.yaml, what GitHub lists for one repository.
    type: object
    additionalProperties: false
    required: [$schema, repository_id, repository, releases]
    properties:
      $schema:
        description: Names this schema and kind.
        const: ../../schemas/catalog.schema.yaml#/$defs/repository
      repository_id:
        description: GitHub's numeric repository ID; it survives renames.
        $ref: '#/$defs/id'
      repository:
        description: owner/name on GitHub when last read.
        type: string
        pattern: ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$
      observed_at:
        description: When the releases were last read from GitHub. Absent only if they never were.
        $ref: '#/$defs/time'
      history_complete:
        description: Whether that read reached the end of the release list, which proves a missing release deleted. Present with observed_at.
        type: boolean
      failed_at:
        description: When the latest attempt failed; present only while the latest attempt failed, and later than observed_at.
        $ref: '#/$defs/time'
      failed_with:
        description: >-
          Why the latest attempt failed, present with failed_at. not_found: GitHub
          says this repository doesn't exist or isn't public. too_large: GitHub's
          answer was larger than the catalog accepts. invalid_response: GitHub's
          answer wasn't what the catalog expects. transport: GitHub couldn't be
          reached.
        type: string
        enum: [not_found, too_large, invalid_response, transport]
      releases:
        description: >-
          Kept releases by GitHub release ID, in numeric order: the 8 newest tags,
          the newest stable tag, the newest tag with a Linux download and the
          newest tag with an AppImage for each processor type, with every
          release under a kept tag. Empty if never read.
        type: object
        additionalProperties: false
        patternProperties:
          ^[1-9][0-9]*$: {$ref: '#/$defs/release'}
      git_scope:
        description: What the recipe asked to read from the repository's Git refs; present with git_refs.
        $ref: '#/$defs/git_scope'
      git_refs:
        description: Git refs read with the releases, by full ref name.
        type: object
        additionalProperties: false
        patternProperties:
          ^refs/(heads|tags)/[^\s]+$: {$ref: '#/$defs/git_ref'}
  release:
    description: One GitHub release. Drafts are never listed.
    type: object
    additionalProperties: false
    required: [tag, published_at, prerelease, assets]
    properties:
      tag:
        description: The release's tag. Two releases can share one.
        type: string
      title:
        description: The release's title, only when it differs from the tag.
        type: string
      url:
        description: The release page, only when it differs from https://github.com/<repository>/releases/tag/<tag> (joined as is, no percent-encoding).
        $ref: '#/$defs/url'
      published_at:
        description: When the release was published; releases are ordered by it, then by ID.
        $ref: '#/$defs/time'
      prerelease:
        description: Whether GitHub marks the release a prerelease.
        type: boolean
      observed_at:
        description: When a later read stopped returning this release (last seen); only when older than the repository's observed_at.
        $ref: '#/$defs/time'
      source_zip_url:
        description: The source zip, only when it differs from https://api.github.com/repos/<repository>/zipball/<tag>.
        $ref: '#/$defs/url'
      source_tar_url:
        description: The source tarball, only when it differs from https://api.github.com/repos/<repository>/tarball/<tag>.
        $ref: '#/$defs/url'
      assets:
        description: Every uploaded file of the latest read, by GitHub asset ID, in numeric order.
        type: object
        additionalProperties: false
        patternProperties:
          ^[1-9][0-9]*$: {$ref: '#/$defs/asset'}
  asset:
    description: One uploaded file; a re-upload is a new asset ID.
    type: object
    additionalProperties: false
    required: [name, size]
    properties:
      name:
        description: The file name.
        type: string
      url:
        description: The download, only when it differs from https://github.com/<repository>/releases/download/<tag>/<name> (joined as is, no percent-encoding).
        $ref: '#/$defs/url'
      size:
        description: Size in bytes.
        $ref: '#/$defs/count'
      sha256pre:
        description: The first 16 hex digits of GitHub's SHA-256 of the file, when GitHub gives one. For noticing a change, never for verifying a download.
        type: string
        pattern: ^[0-9a-f]{16}$
  git_scope:
    description: The Git refs a recipe asked for.
    type: object
    additionalProperties: false
    required: [tags, tags_history_complete]
    properties:
      tags:
        description: Whether tags were read (at most 100, newest first).
        type: boolean
      tags_history_complete:
        description: Whether every tag was read; false when tags is false.
        type: boolean
  git_ref:
    description: One Git branch or tag.
    type: object
    additionalProperties: false
    required: [commit]
    properties:
      commit:
        description: The commit the ref named.
        $ref: '#/$defs/git_object'
      position:
        description: A tag's position in GitHub's tag list, 0 first; tags only.
        type: integer
        minimum: 0
        maximum: 99
      files:
        description: Files read at a branch, by path; branches only.
        type: object
        maxProperties: 4
        additionalProperties: false
        patternProperties:
          ^[^/].*$: {$ref: '#/$defs/git_file'}
  git_file:
    description: One file read at a branch.
    type: object
    additionalProperties: false
    required: [blob, content]
    properties:
      blob:
        description: Its Git blob ID.
        $ref: '#/$defs/git_object'
      content:
        description: Its text, at most 1 MiB.
        type: string

  runs:
    description: catalog/status/runs.yaml, the last 64 collector runs.
    type: object
    additionalProperties: false
    required: [$schema, runs]
    properties:
      $schema:
        description: Names this schema and kind.
        const: ../../schemas/catalog.schema.yaml#/$defs/runs
      runs:
        description: Runs by <GitHub Actions run ID>-<attempt>, oldest first.
        type: object
        maxProperties: 64
        additionalProperties: false
        patternProperties:
          ^[1-9][0-9]*-[1-9][0-9]*$: {$ref: '#/$defs/run'}
  run:
    description: One collector run; a number is omitted when it wasn't measured.
    type: object
    additionalProperties: false
    required: [reported_at, enrolled, selected, succeeded, failed]
    properties:
      reported_at:
        description: When the run wrote this summary.
        $ref: '#/$defs/time'
      enrolled:
        description: Repositories the catalog tracks.
        $ref: '#/$defs/count'
      selected:
        description: Repositories this run chose to read, oldest data first.
        $ref: '#/$defs/count'
      succeeded:
        description: Selected repositories read successfully.
        $ref: '#/$defs/count'
      failed:
        description: Selected repositories whose read failed.
        $ref: '#/$defs/count'
      http_attempts:
        description: HTTP requests sent, retries included.
        $ref: '#/$defs/count'
      charged_bytes:
        description: Response bytes counted against the run's budget.
        $ref: '#/$defs/count'
      acquisition_milliseconds:
        description: Time spent reading GitHub.
        $ref: '#/$defs/count'
      command_milliseconds:
        description: Time the whole collector command took.
        $ref: '#/$defs/count'
      tree_bytes:
        description: Bytes of all catalog/ documents after the run.
        $ref: '#/$defs/count'
      largest_document_bytes:
        description: Bytes of the largest catalog/ document after the run.
        $ref: '#/$defs/count'
      local_object_bytes:
        description: Bytes of the run's local Git objects.
        $ref: '#/$defs/count'
      stop_reason:
        description: >-
          Present only when the run stopped before reading every selected
          repository: request_budget, byte_budget or time_budget (a budget ran
          out), quota (GitHub's rate limit), authentication (GitHub refused the
          token), internal (a collector bug).
        type: string
        enum: [request_budget, byte_budget, time_budget, quota, authentication, internal]

  statistics:
    description: catalog/status/statistics.yaml, how old the catalog's data is.
    type: object
    additionalProperties: false
    required: [$schema, measured_at, under_24h, from_24_to_48h, from_48h_to_14d, over_14d, never_collected]
    properties:
      $schema:
        description: Names this schema and kind.
        const: ../../schemas/catalog.schema.yaml#/$defs/statistics
      measured_at:
        description: When the ages were counted.
        $ref: '#/$defs/time'
      under_24h:
        description: Repositories whose observed_at is under 24 hours old.
        $ref: '#/$defs/count'
      from_24_to_48h:
        description: Repositories whose observed_at is 24 to 48 hours old.
        $ref: '#/$defs/count'
      from_48h_to_14d:
        description: Repositories whose observed_at is 48 hours to 14 days old.
        $ref: '#/$defs/count'
      over_14d:
        description: Repositories whose observed_at is over 14 days old; AM warns before installing from them.
        $ref: '#/$defs/count'
      never_collected:
        description: Repositories never read successfully.
        $ref: '#/$defs/count'
  retired_names:
    description: tools/catalog-collector/retired-names.yaml, repository file names the collector never gives out again. Not under catalog/; only the collector reads it.
    type: object
    additionalProperties: false
    required: [$schema, retired]
    properties:
      $schema:
        description: Names this schema and kind.
        const: ../../schemas/catalog.schema.yaml#/$defs/retired_names
      retired:
        description: Retired names (catalog/repositories/<name>.yaml), in byte order, each true.
        type: object
        additionalProperties: false
        patternProperties:
          ^[a-z0-9][a-z0-9_.+-]{0,63}$: {type: boolean, const: true}

  time:
    description: A UTC time to the second.
    type: string
    format: date-time
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
  url:
    description: An https URL without whitespace.
    type: string
    pattern: ^https://[^/\s][^\s]*$
  id:
    description: A positive 64-bit ID.
    type: integer
    minimum: 1
    maximum: 9223372036854775807
  count:
    description: A non-negative 64-bit integer.
    type: integer
    minimum: 0
    maximum: 9223372036854775807
  git_object:
    description: A Git object ID (SHA-1).
    type: string
    pattern: ^[0-9a-f]{40}$
