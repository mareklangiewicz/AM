name: Main-owned catalog browser (prepared)
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy reviewed main source (requires separate activation variable)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'mareklangiewicz/AM' && github.ref == 'refs/heads/main-marek'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node tools/catalog-browser/test_catalog.mjs
      - run: python3 tools/catalog-browser/stage.py "$RUNNER_TEMP/catalog-pages"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/catalog-pages
  deploy:
    needs: build
    if: inputs.deploy && vars.CATALOG_BROWSER_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed main-owned browser
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
