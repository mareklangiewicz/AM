name: Long tests
# Reports only, like "Fast tests". The whole-tree tier and the container e2e
# take too long for every push; they run on demand and on ci/* branches, so a
# change can be tested before main-marek moves (collection runs only from
# main-marek, so a ci/* branch needs no schedule repin).
on:
  workflow_dispatch:
  push:
    branches: ['ci/**']
permissions: {}
concurrency:
  group: long-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    if: github.repository == 'mareklangiewicz/AM'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3' 'jsonschema==4.19.2' 'ruff==0.17.4'
      - run: sudo apt-get install --yes --no-install-recommends mawk gawk busybox
      - name: Fast tier (tools/fast-tests.sh)
        env:
          RUFF: ruff
        run: tools/fast-tests.sh
  tree:
    if: github.repository == 'mareklangiewicz/AM'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3' 'jsonschema==4.19.2'
      - run: sudo apt-get install --yes --no-install-recommends mawk gawk busybox
      - name: Collector whole-tree tier
        run: python3 -B -m unittest discover -s tools/catalog-collector -p 'tree_*.py'
  e2e:
    if: github.repository == 'mareklangiewicz/AM'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [debian, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Container e2e (${{ matrix.target }})
        run: ENGINE=podman ./test/e2e/run ${{ matrix.target }}
