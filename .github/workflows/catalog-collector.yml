# Manual bounded validation; dispatch requires explicit approval for each run.
name: Restricted catalog validation
on:
  workflow_dispatch:
    inputs:
      approved_revision:
        description: Separately reviewed full pushed commit SHA
        type: string
        required: true
      manifest_sha256:
        description: Separately reviewed exact manifest SHA256
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: restricted-catalog-validation
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'mareklangiewicz/AM' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main-marek'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CTX_REPOSITORY: ${{ github.repository }}
      CTX_REPOSITORY_ID: ${{ github.repository_id }}
      CTX_EVENT: ${{ github.event_name }}
      CTX_REF: ${{ github.ref }}
      CTX_SHA: ${{ github.sha }}
      CTX_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CTX_RUN_ID: ${{ github.run_id }}
      CTX_RUN_ATTEMPT: ${{ github.run_attempt }}
      CTX_APPROVED_REVISION: ${{ inputs.approved_revision }}
      CTX_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing reviewed pin
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate context and enrolled manifest without credentials
        run: |
          python3 -B - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools/catalog-collector')
          from workflow_adapter import preflight
          context = {k[4:].lower(): v for k, v in os.environ.items() if k.startswith('CTX_')}
          raw = pathlib.Path('docs/track/release-catalog/design/staged-manifest.json').read_bytes()
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          preflight(context, raw, revision)
          PY
      - name: Collect exactly the reviewed six numeric release descriptors
        env:
          COLLECTOR_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools/catalog-collector')
          from workflow_adapter import run
          context = {k[4:].lower(): v for k, v in os.environ.items() if k.startswith('CTX_')}
          raw = pathlib.Path('docs/track/release-catalog/design/staged-manifest.json').read_bytes()
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          token = os.environ.pop('COLLECTOR_WORKFLOW_TOKEN').encode('ascii')
          result = run(context, raw, revision, token, pathlib.Path(os.environ['RUNNER_TEMP']) / 'restricted-catalog')
          token = b''
          raise SystemExit(0 if result else 1)
          PY
      - name: Preserve bounded public transfer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # existing reviewed pin
        with:
          name: restricted-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/restricted-catalog/
          retention-days: 7
          if-no-files-found: warn
