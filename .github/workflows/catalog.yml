name: YAML release catalog
# One collector run (tools/catalog-collector/catalog_run.py): collect reads
# GitHub without write access and writes a candidate; publish checks it with
# the host's reader and commits catalog/ to main-marek. Runs never overlap, so
# each reads the catalog/ the previous one committed. Pause it with
# `gh workflow disable catalog.yml`.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions: {}
concurrency:
  group: yaml-release-catalog
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'mareklangiewicz/AM'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      code: ${{ steps.code.outputs.sha }}
    steps:
      # main-marek's tip, not the triggering commit: a queued run must read
      # the catalog/ its predecessor committed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main-marek
          persist-credentials: false
      - id: code
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Read GitHub, write a candidate
        env:
          GH_TOKEN: ${{ github.token }}
          # Unset: catalog_run.BATCH_SIZE.
          BATCH: ${{ vars.CATALOG_BATCH_SIZE }}
        run: |
          python3 -B tools/catalog-collector/catalog_run.py collect \
            --checkout "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/candidate" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" ${BATCH:+--batch-size "$BATCH"}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The code that collected also validates and commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.collect.outputs.code }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Commit catalog/ to main-marek
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The job's token as an HTTP header, as actions/checkout passes it:
          # never in the remote URL, the scratch repository's config or a log.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            python3 -B tools/catalog-collector/catalog_run.py publish \
              --candidate "$RUNNER_TEMP/candidate" --remote https://github.com/mareklangiewicz/AM.git \
              --scratch "$RUNNER_TEMP/publish" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
